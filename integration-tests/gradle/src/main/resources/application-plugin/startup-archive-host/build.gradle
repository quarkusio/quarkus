import io.quarkus.gradle.application.dsl.QuarkusApplicationJvmTestSuite
import io.quarkus.gradle.application.model.QuarkusApplicationJvmStartupArchiveType
import io.quarkus.gradle.application.model.QuarkusApplicationStartupArchiveTrainingExecutionTarget
import org.gradle.api.plugins.jvm.JvmTestSuite

plugins {
    id 'io.quarkus.application'
}

repositories {
    mavenLocal {
        content {
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
}

group = 'org.acme'
version = '1.0.0-SNAPSHOT'

quarkusApplication {
    builds {
        aotJar('hotspot', QuarkusApplicationJvmStartupArchiveType.AOT)
        aotJar('semeru', QuarkusApplicationJvmStartupArchiveType.SCC)
    }
}

def configureTrainingSuite = { JvmTestSuite suite, String buildName ->
    suite.dependencies {
        implementation enforcedPlatform(
                "${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
        implementation project()
        implementation 'io.quarkus:quarkus-junit'
        implementation 'io.rest-assured:rest-assured'
        runtimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    suite.sources.java.srcDir('src/startupArchiveTraining/java')
    suite.targets.configureEach {
        testTask.configure {
            executable = file("${providers.gradleProperty('startupArchiveJavaHome').get()}/bin/java")
        }
    }
    suite.extensions.configure(QuarkusApplicationJvmTestSuite) { quarkusSuite ->
        quarkusSuite.forQuarkusIntegrationTests(buildName)
        quarkusSuite.startupArchiveTraining {
            executionTarget.set(QuarkusApplicationStartupArchiveTrainingExecutionTarget.HOST_JVM)
        }
    }
}

testing {
    suites {
        hotspotTraining(JvmTestSuite) { JvmTestSuite suite ->
            configureTrainingSuite(suite, 'hotspot')
        }
        semeruTraining(JvmTestSuite) { JvmTestSuite suite ->
            configureTrainingSuite(suite, 'semeru')
        }
    }
}

project:
  name: quarkus
  description: CLI for Quarkus
  longDescription: |
    Create projects, manage extensions and perform build and development tasks for Quarkus, the supersonic 
    subatomic Java framework.
  authors:
    - Quarkus Community
  license: Apache-2.0
  copyright: Quarkus contributors
  languages:
    java:
      groupId: io.quarkus
      artifactId: quarkus-cli
      version: 21
  tags:
    - cli
    - quarkus
    - java
  links:
    homepage: https://quarkus.io
    license: https://github.com/quarkusio/quarkus/blob/main/LICENSE

release:
  github:
    owner: quarkusio
    name: quarkus
    tagName: "{{projectVersion}}"
    # the GitHub releases are named after the version (JReleaser defaults to "Release <version>")
    releaseName: "{{projectVersion}}"
    overwrite: false
    # GitHub releases are immutable once published so the CLI archives have to be attached to a draft:
    # JReleaser creates the draft with the archives, the release notes are added and the release is
    # published later in the release process, setting makeLatest explicitly as GitHub doesn't keep
    # the value defined when creating a draft
    immutableRelease: true
    draft: true
    prerelease:
      enabled: false
    makeLatest: FALSE
    skipTag: true
    changelog:
      enabled: false
    milestone:
      close: false

distributions:
  quarkus:
    type: JAVA_BINARY
    executable:
      name: quarkus
      windowsExtension: bat
    tags:
      - quarkus
      - cli
    artifacts:
      - path: target/quarkus-cli-{{projectVersion}}.zip
      - path: target/quarkus-cli-{{projectVersion}}.tar.gz

packagers:
  sdkman:
    active: ALWAYS
    continueOnError: false
    connectTimeout: 20
    readTimeout: 60
    candidate: quarkus
    command: MINOR
  chocolatey:
    active: ALWAYS
    continueOnError: true
    remoteBuild: true
    iconUrl: https://quarkus.io/assets/images/chocolatey-app-icon.png
    packageVersion: '{{projectVersionMajor}}.{{projectVersionMinor}}.{{projectVersionPatch}}'

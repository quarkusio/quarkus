# Configure clients to use BASIC intelligence mode to avoid connection timeout
# issues on non-Linux platforms where Docker container IPs are not routable
quarkus.infinispan-client.devservices.enabled=true
quarkus.infinispan-client.devservices.port=11222
quarkus.infinispan-client.devservices.mcast-port=46667
quarkus.infinispan-client.client-intelligence=BASIC

quarkus.infinispan-client.conn-2.devservices.enabled=true
quarkus.infinispan-client.conn-2.devservices.port=31222
quarkus.infinispan-client.conn-2.devservices.mcast-port=46666
quarkus.infinispan-client.conn-2.client-intelligence=BASIC


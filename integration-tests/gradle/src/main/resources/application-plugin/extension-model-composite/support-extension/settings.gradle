pluginManagement {
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus.extension' version "${quarkusPluginVersion}"
        id 'io.quarkus.extension.deployment' version "${quarkusPluginVersion}"
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'support-extension-parent'
include 'runtime', 'deployment'
project(':runtime').name = 'support-extension'
project(':deployment').name = 'support-extension-deployment'

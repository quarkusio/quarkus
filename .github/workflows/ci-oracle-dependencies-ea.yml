# Allows testing for Oracle dependencies still under development on Oracle Test Pilot platform
name: Quarkus CI - Oracle Dependencies Early Access

permissions:
  contents: read
  actions: read
  packages: read

on:
  # runs periodically and canceled if there are no changes since the last run
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.repository != 'quarkusio/quarkus' }}

env:
  # Workaround testsuite locale issue
  LANG: en_US.UTF-8
  COMMON_MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end"
  COMMON_TEST_MAVEN_ARGS: "-Dformat.skip -Denforcer.skip -DskipDocs -Dforbiddenapis.skip -DskipExtensionValidation -DskipCodestartValidation"
  NATIVE_TEST_MAVEN_ARGS: "-Dtest-containers -Dstart-containers -Dquarkus.native.native-image-xmx=6g -Dnative -Dnative.surefire.skip -Dno-descriptor-tests clean install -DskipDocs"
  JVM_TEST_MAVEN_ARGS: "-Dtest-containers -Dstart-containers -Dquarkus.test.hang-detection-timeout=300"
  # Important: keep these selectors in sync with the grep commands in the calc_run_flags job!
  # This may be a lot better with maven 4, but with maven 3, excluding a project does not exclude its children, and it's not possible to include a project and explicitly exclude some children; compensate by doing excludes the low-tech way, at the shell level
  JVM_TEST_INTEGRATION_TESTS_SELECTOR: "-f integration-tests -pl !gradle -pl !maven -pl !devmode -pl !devtools"
  JVM_TEST_NORMAL_TESTS_SELECTOR: "-pl !docs -Dno-test-modules"
  #PTS_MAVEN_ARGS: "-Ddevelocity.pts.enabled=${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'true' || 'false' }}"
  PTS_MAVEN_ARGS: ""
  PULL_REQUEST_NUMBER: ${{ github.event.number }}
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

defaults:
  run:
    shell: bash

jobs:
  configure:
    name: "Configure jobs"
    runs-on: ubuntu-latest
    # Skip main in forks
    # Skip draft PRs, rerun as soon as its removed
    if: (github.repository == 'quarkusio/quarkus' || !endsWith(github.ref, '/main')) && (
           github.event_name != 'pull_request' || (
             github.event.pull_request.draft == false &&
             github.event.pull_request.state != 'closed' &&
             github.event.action != 'edited'
           )
        )
    outputs:
      config: ${{ steps.configure.outputs.config }}
      m2-monthly-branch-cache-key: ${{ steps.cache-key.outputs.m2-monthly-branch-cache-key }}
      m2-monthly-cache-key: ${{ steps.cache-key.outputs.m2-monthly-cache-key }}
      m2-cache-key: ${{ steps.cache-key.outputs.m2-cache-key }}
      quarkus-metadata-cache-key: ${{ steps.cache-key.outputs.quarkus-metadata-cache-key }}
      quarkus-metadata-cache-key-default: ${{ steps.cache-key.outputs.quarkus-metadata-cache-key-default }}
      maven-disable-scalpel: ${{ steps.scalpel-status.outputs.maven-disable-scalpel }}
      maven-disable-develocity-cache: ${{ steps.develocity-cache-status.outputs.maven-disable-develocity-cache }}
      common-maven-args: ${{ steps.configure-maven-args.outputs.common-maven-args }}
      run-ci-build: ${{ steps.check-changes.outputs.run-ci-build }}
      base-jdk-version: ${{ steps.base-jdk.outputs.base-jdk-version }}
    steps:
      - name: Checkout for base JDK version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: independent-projects/parent/pom.xml
          path: .base-jdk-checkout
      - name: Extract base JDK version from POM
        id: base-jdk
        run: |
          BASE_JDK=$(grep -oP '<maven.compiler.release>\K[0-9]+' .base-jdk-checkout/independent-projects/parent/pom.xml)
          echo "base-jdk-version=${BASE_JDK}" >> $GITHUB_OUTPUT
          echo "Base JDK version: ${BASE_JDK}"
          rm -rf .base-jdk-checkout
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
      - name: Generate cache key
        id: cache-key
        run: |
          CURRENT_BRANCH="${{ github.repository != 'quarkusio/quarkus' && 'fork' || github.base_ref || github.ref_name }}"
          CURRENT_MONTH=$(/bin/date -u "+%Y-%m")
          CURRENT_DAY=$(/bin/date -u "+%d")
          CURRENT_WEEK=$(/bin/date -u "+%Y-%U")
          ROOT_CACHE_KEY="m2-cache"
          echo "m2-monthly-cache-key=${ROOT_CACHE_KEY}-${CURRENT_MONTH}" >> $GITHUB_OUTPUT
          echo "m2-monthly-branch-cache-key=${ROOT_CACHE_KEY}-${CURRENT_MONTH}-${CURRENT_BRANCH}" >> $GITHUB_OUTPUT
          echo "m2-cache-key=${ROOT_CACHE_KEY}-${CURRENT_MONTH}-${CURRENT_BRANCH}-${CURRENT_WEEK}" >> $GITHUB_OUTPUT
          echo "quarkus-metadata-cache-key=quarkus-metadata-cache-${CURRENT_WEEK}-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "quarkus-metadata-cache-key-default=quarkus-metadata-cache-${CURRENT_WEEK}-${{ github.event.repository.default_branch }}" >> $GITHUB_OUTPUT
      - name: Configure Runs-On
        id: configure
        uses: quarkusio/runs-on-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          main-repository: quarkusio/quarkus
          runs-on: true
          magic-cache: true
          small-instance: m6a.large
          large-instance: m6a.xlarge
          ubuntu-latest: ubuntu22-full-x64
      - name: Determines if Scalpel should be disabled
        id: scalpel-status
        run: |
          echo "maven-disable-scalpel=${{ contains( github.event.pull_request.labels.*.name, 'ci/disable-scalpel') }}" >> $GITHUB_OUTPUT
      - name: Determines if Develocity cache should be disabled
        id: develocity-cache-status
        run: |
          echo "maven-disable-develocity-cache=${{ contains( github.event.pull_request.labels.*.name, 'ci/disable-develocity-cache') }}" >> $GITHUB_OUTPUT
      - name: Adjust Maven args
        id: configure-maven-args
        env:
          DEVELOCITY_CACHE_DISABLED: ${{ steps.develocity-cache-status.outputs.maven-disable-develocity-cache }}
        run: |
          if [ "$DEVELOCITY_CACHE_DISABLED" == "true" ]; then
            echo "common-maven-args=${COMMON_MAVEN_ARGS} -Dno-build-cache" >> $GITHUB_OUTPUT
          else
            echo "common-maven-args=${COMMON_MAVEN_ARGS}" >> $GITHUB_OUTPUT
          fi
      # Handle scheduled workflow runs for main branch of quarkusio/quarkus:
      # - we download the previous sha from the last successful scheduled run
      # - we compare it with current and skip the build if there are no changes
      # Note: gh needs the repository around to be able to resolve it
      - name: Checkout repository
        if: github.event_name == 'schedule' && github.ref_name == 'main' && github.repository == 'quarkusio/quarkus'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download previous scheduled build SHA
        if: github.event_name == 'schedule' && github.ref_name == 'main' && github.repository == 'quarkusio/quarkus'
        id: download-previous-sha
        continue-on-error: true
        run: |
          # Find the most recent successful scheduled workflow run
          RUN_ID=$(gh run list \
            --workflow=ci-actions-incremental.yml \
            --branch=main \
            --event=schedule \
            --status=completed \
            --limit=20 \
            --json databaseId,conclusion \
            --jq '.[] | .databaseId' \
            | head -1)

          if [ -n "$RUN_ID" ]; then
            echo "Found previous run: $RUN_ID"
            # Download the artifact containing the SHA
            gh run download "$RUN_ID" --name main-last-build-sha --dir . 2>/dev/null || echo "No artifact found"
          else
            echo "No previous run found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check if CI build is needed
        id: check-changes
        run: |
          # Default: always run CI for non-scheduled events
          if [ "${{ github.event_name }}" != "schedule" ] || \
             [ "${{ github.ref_name }}" != "main" ] || \
             [ "${{ github.repository }}" != "quarkusio/quarkus" ]; then
            echo "Not a scheduled main run - CI will proceed"
            echo "run-ci-build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For scheduled runs: check if there are new commits
          CURRENT_SHA="${{ github.sha }}"

          if [ -f main-last-build-sha.txt ]; then
            LAST_SHA=$(cat main-last-build-sha.txt)
            if [ "$LAST_SHA" == "$CURRENT_SHA" ]; then
              echo "No changes detected since last scheduled run (SHA: $CURRENT_SHA)"
              echo "run-ci-build=false" >> $GITHUB_OUTPUT
            else
              echo "Changes detected: $LAST_SHA -> $CURRENT_SHA"
              echo "run-ci-build=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous SHA found - assuming first run, CI will proceed"
            echo "run-ci-build=true" >> $GITHUB_OUTPUT
          fi
      - name: Save current build SHA for next run
        if: github.event_name == 'schedule' && github.ref_name == 'main' && github.repository == 'quarkusio/quarkus'
        run: echo "${{ github.sha }}" > main-last-build-sha.txt
      - name: Upload build SHA artifact
        if: github.event_name == 'schedule' && github.ref_name == 'main' && github.repository == 'quarkusio/quarkus'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-last-build-sha
          path: main-last-build-sha.txt
          retention-days: 30

  initial-build:
    name: "Initial JDK ${{ needs.configure.outputs.base-jdk-version }} Build"
    needs: [ configure ]
    if: needs.configure.outputs.run-ci-build == 'true'
    runs-on: ${{ fromJson(needs.configure.outputs.config).runners['ubuntu-latest-large'].runsOn && format('{0}/tag={1}', fromJson(needs.configure.outputs.config).runners['ubuntu-latest-large'].runsOn, 'initial-build') || 'ubuntu-latest' }}
    env:
      COMMON_MAVEN_ARGS: ${{ needs.configure.outputs.common-maven-args }}
      RUNS_ON_ENABLED: ${{ fromJson(needs.configure.outputs.config).runners['ubuntu-latest'].runsOn && 'true' || 'false' }}
    outputs:
      scalpel_args: ${{ steps.get-scalpel-config.outputs.scalpel_args }}
      scalpel_impacted: ${{ steps.get-scalpel-config.outputs.impacted_modules }}
      scalpel_impacted_gav: ${{ steps.get-scalpel-config.outputs.impacted_modules_gav }}
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0
      - name: Gradle Enterprise environment
        run: |
          echo "GE_TAGS=jdk-${{ needs.configure.outputs.base-jdk-version }}" >> "$GITHUB_ENV"
          echo "GE_CUSTOM_VALUES=gh-job-name=Initial JDK ${{ needs.configure.outputs.base-jdk-version }} Build" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # this is important for Scalpel to work
          fetch-depth: 0
      - name: Add quarkusio remote
        run: git remote show quarkusio &> /dev/null || git remote add quarkusio https://github.com/quarkusio/quarkus.git
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Print disk usage before build
        run: .github/ci-disk-usage.sh
      - name: Set up JDK ${{ needs.configure.outputs.base-jdk-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ needs.configure.outputs.base-jdk-version }}
      - name: Restore Maven Repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: (github.event_name != 'push' && github.event_name != 'schedule') || github.actor == 'dependabot[bot]'
        with:
          path: ~/.m2/repository
          key: ${{ needs.configure.outputs.m2-cache-key }}
          restore-keys: |
            ${{ needs.configure.outputs.m2-monthly-branch-cache-key }}-
            ${{ needs.configure.outputs.m2-monthly-cache-key }}-
      - name: Cache Maven Repository on push or scheduled build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.actor != 'dependabot[bot]'
        with:
          path: ~/.m2/repository
          key: ${{ needs.configure.outputs.m2-cache-key }}
          restore-keys: |
            ${{ needs.configure.outputs.m2-monthly-branch-cache-key }}-
            ${{ needs.configure.outputs.m2-monthly-cache-key }}-
      - name: Populate the .m2 repository (for cache and for shipping to follow-up builds)
        run: |
          ./mvnw -T2C $COMMON_MAVEN_ARGS -Dscalpel.enabled=false -q dependency:go-offline -Dgo-offline
      - name: Cache Develocity local cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' || github.event_name == 'push' && github.repository != 'quarkusio/quarkus'
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-Initial Build-${{ github.event.pull_request.number || github.event.ref }}-${{ github.event.pull_request.head.sha || github.event.head }}
          restore-keys: |
            develocity-cache-Initial Build-${{ github.event.pull_request.number || github.event.ref }}-
      - name: Verify oracle-test-pilot-jvm-tests.json
        run: ./.github/verify-tests-json.sh oracle-test-pilot-jvm-tests.json integration-tests/
      - name: Verify oracle-test-pilot-native-tests.json
        run: ./.github/verify-tests-json.sh oracle-test-pilot-native-tests.json integration-tests/
      - name: Setup Develocity Build Scan capture
        uses: gradle/develocity-actions/setup-maven@0e1f30c14ab56d0c1ecf229a0ffc3eb3e40e4642 # v2.2
        with:
          capture-strategy: ON_DEMAND
          job-name: "Initial JDK ${{ needs.configure.outputs.base-jdk-version }} Build"
          add-pr-comment: false
          add-job-summary: false
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          develocity-token-expiry: 6
      - name: Build
        env:
          CAPTURE_BUILD_SCAN: true
        run: |
          ./mvnw -T1C $COMMON_MAVEN_ARGS -Dscalpel.enabled=false -DskipTests -DskipITs -DskipDocs -Dinvoker.skip -Dskip.gradle.tests -Djbang.skip -Dtruststore.skip -Dno-format -Dtcks -Prelocations clean install
      - name: Verify extension dependencies
        run: ./update-extension-dependencies.sh $COMMON_MAVEN_ARGS
      - name: Configure Scalpel
        id: get-scalpel-config
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.ref }}
          PUSH_BRANCH: ${{ github.event_name == 'push' && github.ref_name }}
          SCALPEL_DISABLED: ${{ needs.configure.outputs.maven-disable-scalpel }}
        run: |
          SCALPEL_IMPACTED_GAV='_all_'
          if [[ "$SCALPEL_DISABLED" == "true" ]] || [[ "$PUSH_BRANCH" =~ ^main|[0-9]+\.[0-9]+$ ]] || [[ "$PULL_REQUEST_HEAD" =~ ^.*backport.*$ ]]; then
            SCALPEL_ARGS=''
            SCALPEL_IMPACTED='_all_'
          else
            # See also: https://github.com/maveniverse/scalpel#configuration
            # Scalpel is configured as a Maven core extension in .mvn/extensions.xml
            # Default Scalpel settings are in .mvn/maven.config
            # It auto-detects GITHUB_BASE_REF on GitHub Actions
            SCALPEL_ARGS="-Dincremental -Dscalpel.reportFile=target/scalpel-report.json"
            if [ -n "$PULL_REQUEST_BASE" ]
            then
              # The PR defines a clear merge target so just use that branch for reference, *unless*:
              # - the current branch is a backport branch targeting some released branch like 1.10 (merge target is not main)
              SCALPEL_ARGS+=" -Dscalpel.baseBranch=origin/$PULL_REQUEST_BASE -Dscalpel.disableOnBaseBranch='\d+\.\d+'"
            else
              # No PR means the merge target is uncertain so fetch & use main of quarkusio/quarkus, *unless*:
              # - the current branch is main or some released branch like 1.10
              # - the current branch is a backport branch which is going to target some released branch like 1.10 (merge target is not main)
              SCALPEL_ARGS+=" -Dscalpel.baseBranch=refs/remotes/quarkusio/main -Dscalpel.fetchBaseBranch=true -Dscalpel.disableOnBranch='main|\d+\.\d+|.*backport.*'"
            fi

            # mvnw just for creating the JSON report ("validate" should not waste much time if not incremental at all, e.g. on main)
            # report mode includes direct, downstream and upstream modules in the JSON report
            ./mvnw -q -T1C $COMMON_MAVEN_ARGS -Dscan=false -Dtcks -Dquickly-ci $SCALPEL_ARGS -Dscalpel.mode=report validate
            if [ -f target/scalpel-report.json ]; then
              # Extract impacted module paths, excluding upstream-only modules (they don't need testing)
              SCALPEL_IMPACTED=$(jq -r '.affectedModules[] | select(.category != "UPSTREAM") | .path' target/scalpel-report.json)
              if [ -z "$SCALPEL_IMPACTED" ]; then
                SCALPEL_IMPACTED='_all_'
                SCALPEL_ARGS=''
              fi
            else
              SCALPEL_IMPACTED='_all_'
              # when we impact all modules, we do not need to run Scalpel in further jobs
              SCALPEL_ARGS=''
            fi

            # Extract GAV-formatted impacted modules from the JSON report for quickstarts testing
            if [[ "$SCALPEL_IMPACTED" != '_all_' ]]; then
              SCALPEL_IMPACTED_GAV=$(jq -r '.affectedModules[] | select(.category != "UPSTREAM") | "\(.groupId):\(.artifactId)"' target/scalpel-report.json)
              if [ -z "$SCALPEL_IMPACTED_GAV" ]; then
                SCALPEL_IMPACTED_GAV='_all_'
              fi
            fi

            echo "SCALPEL_ARGS: $SCALPEL_ARGS"
          fi

          echo "scalpel_args=${SCALPEL_ARGS}" >> $GITHUB_OUTPUT
          echo "SCALPEL_IMPACTED: ${SCALPEL_IMPACTED}"
          # three steps to retain linefeeds in output for other jobs
          # (see https://github.com/github/docs/issues/21529 and https://github.com/orgs/community/discussions/26288#discussioncomment-3876281)
          echo 'impacted_modules<<EOF' >> $GITHUB_OUTPUT
          echo "${SCALPEL_IMPACTED}" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo 'impacted_modules_gav<<EOF' >> $GITHUB_OUTPUT
          echo "${SCALPEL_IMPACTED_GAV}" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
      - name: Print disk usage after build
        run: .github/ci-disk-usage.sh
      - name: Tar .m2 content pushed to subsequent jobs
        run: |
          if [ -d .m2/.develocity/build-cache ]; then
            tar -czf m2-content.tgz -C ~ .m2/repository/io/quarkus .m2/.develocity/build-cache
          else
            tar -czf m2-content.tgz -C ~ .m2/repository/io/quarkus
          fi
      - name: Upload .m2 content pushed to subsequent jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-content
          path: m2-content.tgz
          retention-days: 7
      - name: Delete snapshots artifacts from cache
        run: find ~/.m2 -name \*-SNAPSHOT -type d -exec rm -rf {} +
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              'target/build-report.json' \
              'target/gradle-build-scan-url.txt' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-Initial JDK ${{ needs.configure.outputs.base-jdk-version }} Build"
          path: |
            build-reports.zip
          retention-days: 7

  calculate-test-jobs:
    name: Calculate Test Jobs
    runs-on: ubuntu-latest
    needs: initial-build
    env:
      SCALPEL_IMPACTED_MODULES: ${{ needs.initial-build.outputs.scalpel_impacted }}
    outputs:
      otp_jvm_matrix: ${{ steps.calc-otp-jvm-matrix.outputs.matrix }}
      otp_native_matrix: ${{ steps.calc-otp-native-matrix.outputs.matrix }}
      run_devtools: ${{ steps.calc-run-flags.outputs.run_devtools }}
      run_gradle: ${{ steps.calc-run-flags.outputs.run_gradle }}
      run_maven: ${{ steps.calc-run-flags.outputs.run_maven }}
      run_kubernetes: ${{ steps.calc-run-flags.outputs.run_kubernetes }}
      run_quickstarts: ${{ steps.calc-run-flags.outputs.run_quickstarts }}
      run_tcks: ${{ steps.calc-run-flags.outputs.run_tcks }}
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calculate matrix from oracle-test-pilot-jvm-tests.json
        id: calc-otp-jvm-matrix
        run: |
          echo "SCALPEL_IMPACTED_MODULES: ${SCALPEL_IMPACTED_MODULES}"
          json=$(.github/filter-integration-tests-json.sh oracle-test-pilot-jvm "${SCALPEL_IMPACTED_MODULES}" | tr -d '\n')
          echo "${json}"
          echo "matrix=${json}" >> $GITHUB_OUTPUT
      - name: Calculate matrix from oracle-test-pilot-native-tests.json
        id: calc-otp-native-matrix
        run: |
          echo "SCALPEL_IMPACTED_MODULES: ${SCALPEL_IMPACTED_MODULES}"
          json=$(.github/filter-integration-tests-json.sh oracle-test-pilot-native "${SCALPEL_IMPACTED_MODULES}" | tr -d '\n')
          echo "${json}"
          echo "matrix=${json}" >> $GITHUB_OUTPUT
      - name: Calculate run flags
        id: calc-run-flags
        run: |
          run_devtools=true; run_gradle=true; run_maven=true; run_kubernetes=true; run_quickstarts=true; run_tcks=true;
          if [ -z "${SCALPEL_IMPACTED_MODULES}" ]
          then
            run_devtools=false; run_gradle=false; run_maven=false; run_kubernetes=false; run_quickstarts=false; run_tcks=false
          elif [ "${SCALPEL_IMPACTED_MODULES}" != '_all_' ]
          then
            # Important: keep -pl ... in actual jobs in sync with the following grep commands!
            # do not use grep -q as it can exit before echo has finished outputting and cause broken pipes
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep 'integration-tests/devtools' > /dev/null); then run_devtools=false; fi
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep 'integration-tests/gradle' > /dev/null); then run_gradle=false; fi
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep -P 'integration-tests/(maven|devmode)' > /dev/null); then run_maven=false; fi
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep -P 'integration-tests/kubernetes/.*' > /dev/null); then run_kubernetes=false; fi
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep -Pv '(docs|integration-tests|tcks)/.*' > /dev/null); then run_quickstarts=false; fi
            if ! (echo -n "${SCALPEL_IMPACTED_MODULES}" | grep 'tcks/.*' > /dev/null); then run_tcks=false; fi
          fi
          echo "run_devtools=${run_devtools}, run_gradle=${run_gradle}, run_maven=${run_maven}, run_kubernetes=${run_kubernetes}, run_quickstarts=${run_quickstarts}, run_tcks=${run_tcks}"
          echo "run_devtools=${run_devtools}" >> $GITHUB_OUTPUT
          echo "run_gradle=${run_gradle}" >> $GITHUB_OUTPUT
          echo "run_maven=${run_maven}" >> $GITHUB_OUTPUT
          echo "run_kubernetes=${run_kubernetes}" >> $GITHUB_OUTPUT
          echo "run_quickstarts=${run_quickstarts}" >> $GITHUB_OUTPUT
          echo "run_tcks=${run_tcks}" >> $GITHUB_OUTPUT

  oracle-test-pilot-jvm-tests:
    name: Oracle Test Pilot ${{matrix.category}} - JDK ${{matrix.java-version}}
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    # Shared environment: make extra sure not to leak a GitHub token with any permission.
    permissions:
      contents: read
    needs: [configure, initial-build, calculate-test-jobs]
    if: github.repository == 'quarkusio/quarkus' && needs.calculate-test-jobs.outputs.otp_jvm_matrix != '{}'
    env:
      COMMON_MAVEN_ARGS: ${{ needs.configure.outputs.common-maven-args }}
    timeout-minutes: ${{matrix.timeout}}
    strategy:
      max-parallel: ${{ fromJson(needs.configure.outputs.config).maxParallel || 5 }}
      fail-fast: false
      matrix: ${{ fromJson(needs.calculate-test-jobs.outputs.otp_jvm_matrix) }}
    steps:
      - name: Gradle Enterprise environment
        run: |
          category=$(echo -n '${{matrix.category}}' | tr '[:upper:]' '[:lower:]' | tr -c '[:alnum:]-' '-' | sed -E 's/-+/-/g')
          echo "GE_TAGS=oracle-test-pilot-${{matrix.category}}-jdk-${{matrix.java-version}}" >> "$GITHUB_ENV"
          echo "GE_CUSTOM_VALUES=gh-job-name=Oracle Test Pilot ${{matrix.category}} - JDK ${{matrix.java-version}}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Maven Repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.configure.outputs.m2-cache-key }}
          restore-keys: |
            ${{ needs.configure.outputs.m2-monthly-branch-cache-key }}-
            ${{ needs.configure.outputs.m2-monthly-cache-key }}-
      - name: Download previously uploaded .m2 content
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2-content
          path: .
      - name: Extract previously uploaded .m2 content
        run: tar -xzf m2-content.tgz -C ~
      - name: Set up JDK ${{ needs.configure.outputs.base-jdk-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ needs.configure.outputs.base-jdk-version }}
      - name: Setup Develocity Build Scan capture
        uses: gradle/develocity-actions/setup-maven@0e1f30c14ab56d0c1ecf229a0ffc3eb3e40e4642 # v2.2
        with:
          capture-strategy: ON_DEMAND
          job-name: "Oracle Test Pilot ${{matrix.category}} - JDK ${{matrix.java-version}}"
          add-pr-comment: false
          add-job-summary: false
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          develocity-token-expiry: 6
      - name: Create Oracle Test Pilot Database
        id: create_database
        uses: oracle-actions/setup-testpilot@5622b688a27bde714b9b914a5147d6d96aa0af6f # v1.0.29
        with:
          oci-service: ${{ matrix.oci-service }}
          action: create
          user: quarkus_test
      - name: Build
        env:
          # Begin OTP setup
          ADDITIONAL_REPO_URL: "https://${{ env.API_HOST }}/ords/testpilot/repository"
          TESTPILOT_USERNAME: quarkus_test_${{ github.run_number }}
          TESTPILOT_PASSWORD: ${{ steps.create_database.outputs.database_password }}
          TESTPILOT_CONNECTION_STRING_SUFFIX: ${{ steps.create_database.outputs.connection_string_suffix }}
          RUNID: ${{ github.run_number }}
          API_HOST: ""
          TESTPILOT_CLIENT_ID: ""
          TESTPILOT_TOKEN: ""
          # Needed for TFO (TCP fast open)
          LD_PRELOAD: /home/ubuntu/ojdbc_tfo/ojdbc17/23.26.3.0.0/libtfojdbc1.so
          LD_LIBRARY_PATH: /home/ubuntu/ojdbc_tfo/ojdbc17/23.26.3.0.0
          # End OTP setup
          TEST_MODULES: ${{matrix.test-modules}}
          CAPTURE_BUILD_SCAN: true
        run: |
          export LANG=en_US && \
            ./mvnw $COMMON_MAVEN_ARGS $COMMON_TEST_MAVEN_ARGS $PTS_MAVEN_ARGS \
            $JVM_TEST_MAVEN_ARGS \
            -Doracle.jdbc.url=jdbc:oracle:thin:@${TESTPILOT_CONNECTION_STRING_SUFFIX} \
            -Doracle.reactive.url=vertx-reactive:oracle:thin:@${TESTPILOT_CONNECTION_STRING_SUFFIX} \
            -Doracle.username=${TESTPILOT_USERNAME} \
            -Doracle.password=${TESTPILOT_PASSWORD} \
            -Doracle.db-version=${{matrix.db-version}} \
            -Pojdbc-ea -f integration-tests -pl "$TEST_MODULES" \
            clean install
      - name: Delete Oracle Test Pilot Database
        id: delete_database
        if: always() && steps.create_database.outcome == 'success'
        uses: oracle-actions/setup-testpilot@5622b688a27bde714b9b914a5147d6d96aa0af6f # v1.0.29
        with:
          oci-service: ${{ matrix.oci-service }}
          action: delete
          user: quarkus_test
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              'integration-tests/**/target/*-reports/TEST-*.xml' \
              'integration-tests/**/target/build-report.json' \
              'integration-tests/**/target/gradle-build-scan-url.txt' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-Oracle Test Pilot ${{matrix.category}} - JDK ${{matrix.java-version}}"
          path: |
            build-reports.zip
          retention-days: 7

  oracle-test-pilot-native-tests:
    name: "Oracle Test Pilot ${{matrix.category}} - Native"
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    # Shared environment: make extra sure not to leak a GitHub token with any permission.
    permissions:
      contents: read
    needs: [configure, initial-build, calculate-test-jobs]
    if: github.repository == 'quarkusio/quarkus' && needs.calculate-test-jobs.outputs.otp_native_matrix != '{}'
    env:
      COMMON_MAVEN_ARGS: ${{ needs.configure.outputs.common-maven-args }}
    timeout-minutes: ${{matrix.timeout}}
    strategy:
      max-parallel: ${{ fromJson(needs.configure.outputs.config).maxParallel || 5 }}
      fail-fast: false
      matrix: ${{ fromJson(needs.calculate-test-jobs.outputs.otp_native_matrix) }}
    steps:
      - name: Gradle Enterprise environment
        run: |
          category=$(echo -n '${{matrix.category}}' | tr '[:upper:]' '[:lower:]' | tr -c '[:alnum:]-' '-' | sed -E 's/-+/-/g')
          echo "GE_TAGS=oracle-test-pilot-${{matrix.category}}-native" >> "$GITHUB_ENV"
          echo "GE_CUSTOM_VALUES=gh-job-name=Oracle Test Pilot ${{matrix.category}} - Native" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Maven Repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.m2/repository
          key: ${{ needs.configure.outputs.m2-cache-key }}
          restore-keys: |
            ${{ needs.configure.outputs.m2-monthly-branch-cache-key }}-
            ${{ needs.configure.outputs.m2-monthly-cache-key }}-
      - name: Download previously uploaded .m2 content
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2-content
          path: .
      - name: Extract previously uploaded .m2 content
        run: tar -xzf m2-content.tgz -C ~
      - name: Setup GraalVM
        id: setup-graalvm
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          version: 'mandrel-latest'
          java-version: '25'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # We do this so we can get better analytics for the downloaded version of the build images
      - name: Update Docker Client User Agent
        run: |
          if [ -f ~/.docker/config.json ]; then
            cat <<< $(jq '.HttpHeaders += {"User-Agent": "Quarkus-CI-Docker-Client"}' ~/.docker/config.json) > ~/.docker/config.json
          fi
      - name: Setup Develocity Build Scan capture
        uses: gradle/develocity-actions/setup-maven@0e1f30c14ab56d0c1ecf229a0ffc3eb3e40e4642 # v2.2
        with:
          capture-strategy: ON_DEMAND
          job-name: "Oracle Test Pilot ${{matrix.category}} - Native"
          add-pr-comment: false
          add-job-summary: false
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          develocity-token-expiry: 6
      - name: Create Oracle Test Pilot Database
        id: create_database
        uses: oracle-actions/setup-testpilot@5622b688a27bde714b9b914a5147d6d96aa0af6f # v1.0.29
        with:
          oci-service: ${{ matrix.oci-service }}
          action: create
          # This needs to be unique to the job, in particular it must be different to the TestPilot JVM job
          user: quarkus_test_native
      - name: Build
        env:
          # Begin OTP setup
          ADDITIONAL_REPO_URL: "https://${{ env.API_HOST }}/ords/testpilot/repository"
          TESTPILOT_USERNAME: quarkus_test_native_${{ github.run_number }}
          TESTPILOT_PASSWORD: ${{ steps.create_database.outputs.database_password }}
          TESTPILOT_CONNECTION_STRING_SUFFIX: ${{ steps.create_database.outputs.connection_string_suffix }}
          RUNID: ${{ github.run_number }}
          API_HOST: ""
          TESTPILOT_CLIENT_ID: ""
          TESTPILOT_TOKEN: ""
          # Needed for TFO (TCP fast open)
          # TODO: enable after fixing https://github.com/quarkusio/quarkus/issues/54479
          #LD_PRELOAD: /home/ubuntu/ojdbc_tfo/ojdbc17/23.26.3.0.0/libtfojdbc1.so
          #LD_LIBRARY_PATH: /home/ubuntu/ojdbc_tfo/ojdbc17/23.26.3.0.0
          #  -Dquarkus.native.additional-build-args='-ELD_PRELOAD,-ELD_LIBRARY_PATH' \
          # End OTP setup
          TEST_MODULES: ${{matrix.test-modules}}
          CONTAINER_BUILD: false # Docker is not available on Oracle Test Pilot
          CAPTURE_BUILD_SCAN: true
        run: |
          export LANG=en_US && \
            ./mvnw $COMMON_MAVEN_ARGS $COMMON_TEST_MAVEN_ARGS $PTS_MAVEN_ARGS \
            -Doracle.jdbc.url=jdbc:oracle:thin:@${TESTPILOT_CONNECTION_STRING_SUFFIX} \
            -Doracle.reactive.url=vertx-reactive:oracle:thin:@${TESTPILOT_CONNECTION_STRING_SUFFIX} \
            -Doracle.username=${TESTPILOT_USERNAME} \
            -Doracle.password=${TESTPILOT_PASSWORD} \
            -Doracle.db-version=${{matrix.db-version}} \
            $NATIVE_TEST_MAVEN_ARGS -Dquarkus.native.container-build=false -Dquarkus.native.native-image-xmx=16g \
            -Pojdbc-ea -f integration-tests -pl "$TEST_MODULES"
      - name: Delete Oracle Test Pilot Database
        id: delete_database
        if: always() && steps.create_database.outcome == 'success'
        uses: oracle-actions/setup-testpilot@5622b688a27bde714b9b914a5147d6d96aa0af6f # v1.0.29
        with:
          oci-service: ${{ matrix.oci-service }}
          action: delete
          user: quarkus_test_native
      - name: Prepare build reports archive
        if: always()
        run: |
          7z a -tzip build-reports.zip -r \
              'integration-tests/**/target/*-reports/TEST-*.xml' \
              'integration-tests/**/target/build-report.json' \
              'integration-tests/**/target/gradle-build-scan-url.txt' \
              LICENSE
      - name: Upload build reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "build-reports-${{ github.run_attempt }}-Oracle Test Pilot ${{matrix.category}} - Native"
          path: |
            build-reports.zip
          retention-days: 7

  build-report:
    runs-on: ubuntu-latest
    name: Build report
    needs: [configure,initial-build,oracle-test-pilot-jvm-tests,oracle-test-pilot-native-tests]
    if: always() && needs.configure.outputs.run-ci-build == 'true'
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: build-reports-artifacts
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
      - name: Produce report and add it as job summary
        uses: quarkusio/action-build-reporter@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-reports-artifacts-path: build-reports-artifacts

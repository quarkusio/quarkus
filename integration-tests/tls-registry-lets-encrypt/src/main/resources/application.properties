quarkus.tls.lets-encrypt.client.enabled=true
quarkus.tls.lets-encrypt.client.domains=localhost
quarkus.tls.lets-encrypt.client.terms-of-service-agreed=true
quarkus.tls.lets-encrypt.client.emails=admin@example.org
quarkus.tls.lets-encrypt.client.storage-directory=target/lets-encrypt
quarkus.tls.lets-encrypt.client.acme-server-tls-configuration-name=pebble
# Pebble validates the HTTP-01 challenge on the HTTP port of the tests
quarkus.http.insecure-requests=enabled

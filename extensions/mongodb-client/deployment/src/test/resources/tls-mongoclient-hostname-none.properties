quarkus.mongodb.connection-string=mongodb://127.0.0.1:27018
quarkus.mongodb.tls-configuration-name=mongo
quarkus.tls.mongo.key-store.pem.0.cert=target/certs/mongo-hostname-cert-client.crt
quarkus.tls.mongo.key-store.pem.0.key=target/certs/mongo-hostname-cert-client.key
quarkus.tls.mongo.trust-store.pem.certs=target/certs/mongo-hostname-cert-client-ca.crt
quarkus.tls.mongo.hostname-verification-algorithm=NONE

# Default timeout used by tests, see test-framework/junit-timeouts.
# Keys are looked up from most to least specific:
#   <module path>.<Class>.<method>.timeout
#   <module path>.<Class>.timeout
#   <module path>.timeout (then each parent path)
#   timeout
timeout=20s

# Modules whose tests used to wait for longer than the default, at the time the shared timeout was introduced.
# Lower these (or remove them) once the underlying waits are understood.

# Serve HTTPS only, on the OpenSSL (netty-tcnative) engine, advertising post-quantum key exchange.
quarkus.tls.key-store.pem.0.cert=server-cert.pem
quarkus.tls.key-store.pem.0.key=server-key.pem
quarkus.tls.ssl-engine=openssl
quarkus.tls.pqc-enforcement-policy=client-negotiated
quarkus.tls.key-exchange-groups=X25519MLKEM768,X25519
quarkus.http.insecure-requests=disabled
quarkus.http.test-ssl-port=0

# The PEM files are classpath resources: include them in the native executable
quarkus.native.resources.includes=server-cert.pem,server-key.pem

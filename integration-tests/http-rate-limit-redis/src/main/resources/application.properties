quarkus.application.name=http-rate-limit-redis

# one Dev Services Redis for the default client, another for the 'limits' client of RedisNamedClientTest
quarkus.redis.limits.devservices.enabled=true

quarkus.http.rate-limit.api.paths=/api/*
quarkus.http.rate-limit.api.phase=pre-authentication
quarkus.http.rate-limit.api.request-key=header:X-Client
quarkus.http.rate-limit.api.permits=3
quarkus.http.rate-limit.api.window=1m
quarkus.http.rate-limit.api.store=redis

# lease mode: T = 10s, so the lease time (lease-size x T = 20s) outlives every test and no chunk expires
quarkus.http.rate-limit.lease.paths=/lease/*
quarkus.http.rate-limit.lease.phase=pre-authentication
quarkus.http.rate-limit.lease.request-key=header:X-Client
quarkus.http.rate-limit.lease.permits=6
quarkus.http.rate-limit.lease.window=1m
quarkus.http.rate-limit.lease.store=redis
quarkus.http.rate-limit.lease.lease-size=2

quarkus.http.rate-limit.store-timeout=500ms
# a store failure answers 503 instead of falling back to local limiting, so the tests see every Redis failure
quarkus.http.rate-limit.store-failure-mode=closed

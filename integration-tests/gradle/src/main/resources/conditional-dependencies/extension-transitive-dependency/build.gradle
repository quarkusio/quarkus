plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal {
        content {
            includeGroup 'org.acme' // for dependencies built in this test
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

dependencies {
    runtimeOnly 'org.acme:ext-t:1.0-SNAPSHOT'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'org.acme'
            artifactId = 'extension-transitive-dependency'
            version = '1.0-SNAPSHOT'

            from components.java
        }
    }
}

quarkus.redis.hosts=redis://localhost:6379/0

# TLS-only server (see the docker-maven-plugin configuration in the pom): rediss:// URI, PEM trust certificate
# generated at build time by the smallrye certificate generator, and full peer (hostname) verification.
quarkus.redis.secure.hosts=rediss://localhost:6380/0
quarkus.redis.secure.tls.trust-certificate-pem.certs=${project.build.directory}/certificates/redis-client-ca.crt
quarkus.redis.secure.tls.hostname-verification-algorithm=HTTPS

# Redis cluster (see the docker-maven-plugin configuration in the pom): six nodes on localhost:6400-6405, three of
# them configured as the seeds the topology is discovered from.
quarkus.redis.cluster.hosts=redis://localhost:6400,redis://localhost:6401,redis://localhost:6402
quarkus.redis.cluster.client-type=cluster

# Redis Sentinel deployment (see the docker-maven-plugin configuration in the pom): the master on localhost:6500, its
# replica on 6501 and three sentinels on 6502-6504 monitoring it as "mymaster". The sentinel client goes through the
# sentinels; the replication client addresses the master and the replica directly.
quarkus.redis.sentinel.hosts=redis://localhost:6502,redis://localhost:6503,redis://localhost:6504
quarkus.redis.sentinel.client-type=sentinel
quarkus.redis.sentinel.master-name=mymaster
quarkus.redis.replication.hosts=redis://localhost:6500,redis://localhost:6501
quarkus.redis.replication.client-type=replication

# Client configured through a RedisHostsProvider bean (LettuceHostsProvider) instead of hosts: the standalone server,
# database 3.
quarkus.redis.provided.hosts-provider-name=lettuce-it-hosts

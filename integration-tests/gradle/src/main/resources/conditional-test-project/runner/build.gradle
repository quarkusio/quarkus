plugins {
    id 'java-library'
    id 'io.quarkus'
}

repositories {
    mavenLocal {
        content {
            includeGroup 'org.acme' // for dependencies built in this test
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    implementation 'io.quarkus:quarkus-rest'

    // Keep this api dependency before the directly declared extension to verify that the extension remains top-level.
    api 'org.acme:extension-transitive-dependency:1.0-SNAPSHOT'
    implementation 'org.acme:ext-a:1.0-SNAPSHOT'
    implementation 'org.acme:ext-c:1.0-SNAPSHOT'
    implementation 'org.acme:ext-t:1.0-SNAPSHOT'

    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
}

plugins {
    id 'java'
    id 'io.quarkus.application'
}

group = 'org.acme'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenLocal {
        content {
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

sourceSets {
    additional {
        java {
            srcDir 'src/additional/java'
        }
    }
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation sourceSets.additional.output
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-hibernate-orm-rest-data-panache'
    implementation 'io.quarkus:quarkus-jdbc-h2'
    implementation 'io.quarkus:quarkus-agroal'
    implementation 'io.quarkus:quarkus-liquibase'
}

quarkusApplication {
    builds {
        fastJar('app')
    }
}

def writeDaemonPid = { String taskName, String fileName ->
    tasks.register(taskName) {
        def outputFile = layout.buildDirectory.file(fileName)
        outputs.file(outputFile)
        outputs.upToDateWhen { false }
        doLast {
            outputFile.get().asFile.text = Long.toString(ProcessHandle.current().pid())
        }
    }
}

def daemonPidBefore = writeDaemonPid('writeGradleDaemonPidBefore', 'gradle-daemon-before.txt')
writeDaemonPid('writeGradleDaemonPidAfter', 'gradle-daemon-after.txt')
tasks.named('quarkusAppRun') {
    dependsOn daemonPidBefore
}

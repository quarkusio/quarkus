quarkus.datasource.db-kind=mssql
#Uncomment to connect over SSL/TLS
#quarkus.datasource.reactive.trust-all=true
#quarkus.datasource.reactive.mssql.ssl=true
quarkus.devservices.license-acceptance=@mssql.image@

# Dev Services starts SQL Server with a self-signed certificate that does not match the host name
# (hostname verification defaults to HTTPS)
quarkus.datasource.reactive.hostname-verification-algorithm=NONE

name: Surge.sh Preview

on:
  workflow_run:
    workflows: ["Quarkus Documentation CI"]
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      # this is unfortunately needed to be able to write comments on pull requests
      pull-requests: write
      packages: read
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quarkusio/quarkusio.github.io
          fetch-depth: 5000
          fetch-tags: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quarkusio/quarkus
          path: quarkus-main

      - name: Download PR Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: documentation
          path: documentation-temp
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download changed pages
        # the Documentation Site Tests job only uploads this when it actually ran
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: changed-pages
          path: changed-pages-temp
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and expose PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_run.pull_requests is empty for pull requests opened from forks:
          # look the pull request up from the branch the documentation build ran on instead.
          if [[ -z "$RAW_PR_NUMBER" ]]; then
            RAW_PR_NUMBER=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f per_page=100 \
              --jq '.[0].number // empty')
          fi
          if ! [[ "$RAW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $RAW_PR_NUMBER" >&2
            exit 1
          fi
          echo "id=$RAW_PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Sync documentation
        shell: bash
        # make sure we override the script coming from the artifact with the version from the main repository
        run: |
          rm ./documentation-temp/docs/sync-web-site.sh
          cp -a ./quarkus-main/docs/sync-web-site.sh ./documentation-temp/docs/
          chmod 755 ./documentation-temp/docs/sync-web-site.sh
          ./documentation-temp/docs/sync-web-site.sh main ../../
          rm -rf documentation-temp
          rm -rf quarkus-main

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build with Maven
        run: QUARKUS_ROQ_GENERATOR_BATCH=true QUARKUS_PROFILE=only-latest-guides ./mvnw -B package quarkus:run -DskipTests

      - name: Reduce the size of the website to be compatible with surge
        run: |
          rm -rf target/roq/assets/images/posts/
          rm -rf target/roq/assets/images/books/
          rm -rf target/roq/assets/images/events/
          rm -rf target/roq/assets/images/quarkus2/
          rm -rf target/roq/assets/images/quarkus3/
          rm -rf target/roq/assets/images/worldtour/
          rm -rf target/roq/assets/stickers
          rm -rf target/roq/assets/images/desktopwallpapers
          rm -rf target/roq/assets/images/stickers
          rm -rf target/roq/newsletter
          # we only need the images from the main version
          rm -rf target/roq/guides/images/
          rm -rf target/roq/blog/
      - name: List changed pages
        id: pages
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
        run: |
          base="https://quarkus-pr-main-${PR_ID}-preview.surge.sh"
          links=""
          # changed-pages.txt is written by the Documentation Site Tests job and holds
          # the scope on the first line and the comma separated changed pages on the second
          if [ -f changed-pages-temp/changed-pages.txt ]; then
            { read -r mode; IFS=',' read -ra paths; } < changed-pages-temp/changed-pages.txt
            rm -rf changed-pages-temp
            case "$mode" in
              skip)
                links=$'\n'"🤔 It looks like nothing changed compared to the live site."
                ;;
              full)
                links=$'\n'"🌊 Many pages changed, so they are not listed individually."
                ;;
              partial)
                # deep links are only listed when fewer than 5 pages changed
                if [ "${#paths[@]}" -ge 5 ]; then
                  links=$'\n'"🌊 Many pages changed (${#paths[@]}), so they are not listed individually."
                else
                  list=""
                  for p in "${paths[@]}"; do
                    # the artifact comes from the PR, so only accept plain paths
                    [[ $p =~ ^/[A-Za-z0-9_./-]*$ ]] || continue
                    list+="- ${base}${p}"$'\n'
                  done
                  [ -n "$list" ] && links=$'\n'"👀 Changed pages:"$'\n\n'"${list}"
                fi
                ;;
            esac
            links=${links%$'\n'}
            [ -n "$links" ] && links+=$'\n\n'"_Change detection can sometimes be wrong, so treat this as a guide only._"
          fi
          {
            echo "links<<EOF_LINKS"
            echo "$links"
            echo "EOF_LINKS"
          } >> $GITHUB_OUTPUT

      - name: Publishing to surge for preview
        id: deploy
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx surge@0.23.1 ./target/roq --domain "https://quarkus-pr-main-${PR_ID}-preview.surge.sh" --token "$SURGE_TOKEN"

      - name: Update PR status comment on success
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            🚀 PR ${{ github.sha }} Documentation Preview has been successfully built and deployed to https://quarkus-pr-main-${{ steps.pr.outputs.id }}-preview.surge.sh/version/main/guides/
            ${{ steps.pages.outputs.links }}

            - ✂️ Images of blog posts older than 3 months are not available.
            - ✂️ Newsletters older than 3 months are not available.
          body-marker: <!-- Preview status comment marker -->
      - name: Update PR status comment on failure
        uses: quarkusio/action-helpers@main
        if: ${{ failure() }}
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            😭 Deploy PR Documentation Preview failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          body-marker: <!-- Preview status comment marker -->

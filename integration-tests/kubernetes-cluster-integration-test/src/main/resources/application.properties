quarkus.kubernetes.deployment-target=kubernetes,openshift
# quarkus-openshift transitively pulls in quarkus-container-image-openshift (S2I builder), which
# conflicts with quarkus-container-image-docker unless the builder is pinned explicitly.
quarkus.container-image.builder=docker
quarkus.kubernetes.ingress.expose=true
quarkus.openshift.route.expose=true
# Not set unconditionally here: CRC's router serves plain-http routes fine without it, but its self-signed
# router certificate isn't trusted by a plain JVM truststore, so RestAssured fails HTTPS requests against it
# with a PKIX path building error. Managed clusters (e.g. Red Hat Developer Sandbox) are the opposite - their
# router only serves https (answering plain http with its own "Application is not available" page) but their
# certificate is properly CA-signed, so HTTPS just works there. Pass this explicitly when targeting a cluster
# that needs it, e.g. -Dquarkus.openshift.route.tls.termination=edge for the Sandbox.

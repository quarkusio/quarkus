pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'io.quarkus.application') {
                useModule("io.quarkus.application:gradle-app-plugin:"
                    + providers.gradleProperty('quarkusPluginVersion').get())
            }
        }
    }
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus.application' version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'application-package-formats'
include 'consumer'

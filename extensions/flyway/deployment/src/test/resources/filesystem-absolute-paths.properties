# Datasource default (core operations)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost/mem:test_core_abs;DB_CLOSE_DELAY=-1

# Datasource for "reporting"
quarkus.datasource.reporting.db-kind=h2
quarkus.datasource.reporting.username=sa
quarkus.datasource.reporting.password=sa
quarkus.datasource.reporting.jdbc.url=jdbc:h2:tcp://localhost/mem:test_reporting_abs;DB_CLOSE_DELAY=-1

# Flyway configuration for default datasource (core) - absolute filesystem path
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=filesystem:/tmp/flyway-bug-test/core/sql

# Flyway configuration for "reporting" datasource - absolute filesystem path
quarkus.flyway.reporting.migrate-at-start=true
quarkus.flyway.reporting.baseline-on-migrate=true
quarkus.flyway.reporting.locations=filesystem:/tmp/flyway-bug-test/reporting/sql
quarkus.log.category."io.quarkus.flyway.runtime".level=DEBUG

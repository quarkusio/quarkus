pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'io.quarkus.application') {
                // Exercise the implementation module directly; plugin-marker resolution is covered elsewhere.
                useModule("io.quarkus.application:gradle-app-plugin:${quarkusPluginVersion}")
            }
        }
    }
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus.application' version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'application-remote-dev'

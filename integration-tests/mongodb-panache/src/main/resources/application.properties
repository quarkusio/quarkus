quarkus.mongodb.connection-string=mongodb://localhost:27017,localhost:27018
quarkus.mongodb.write-concern.journal=false
quarkus.mongodb.database=books

# fake a different MongoDB instance
quarkus.mongodb.cl2.connection-string=mongodb://localhost:27017,localhost:27018
quarkus.mongodb.cl2.write-concern.journal=false

#quarkus.log.category."io.quarkus.mongodb.panache.runtime".level=DEBUG
quarkus.mongodb.metrics.enabled=true

# make the transaction reaper check frequently so timeout tests don't need to wait 120s
quarkus.transaction-manager.reaper.check-period=500ms

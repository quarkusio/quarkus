<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 250" width="790" height="250" font-family="sans-serif" font-size="12">
<title>A fixed window against continuous refill, for five requests just before and five just after a minute boundary</title>
<rect width="790" height="250" fill="#ffffff"/>
<text x="10" y="78" text-anchor="start" fill="#222" font-weight="600">fixed window</text>
<text x="10" y="94" text-anchor="start" fill="#666" font-size="11">counter reset each minute</text>
<line x1="170" y1="80" x2="770" y2="80" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="338.0" cy="80" r="5" fill="#0ca30c"/>
<circle cx="352.40000000000003" cy="80" r="5" fill="#0ca30c"/>
<circle cx="366.80000000000007" cy="80" r="5" fill="#0ca30c"/>
<circle cx="381.19999999999993" cy="80" r="5" fill="#0ca30c"/>
<circle cx="395.59999999999997" cy="80" r="5" fill="#0ca30c"/>
<circle cx="419.59999999999997" cy="80" r="5" fill="#0ca30c"/>
<circle cx="434.0" cy="80" r="5" fill="#0ca30c"/>
<circle cx="448.40000000000003" cy="80" r="5" fill="#0ca30c"/>
<circle cx="462.80000000000007" cy="80" r="5" fill="#0ca30c"/>
<circle cx="477.19999999999993" cy="80" r="5" fill="#0ca30c"/>
<text x="770" y="106" text-anchor="end" fill="#d03b3b" font-size="11" font-family="monospace">10 of 10 admitted within 6 s</text>
<text x="10" y="158" text-anchor="start" fill="#222" font-weight="600">this extension</text>
<text x="10" y="174" text-anchor="start" fill="#666" font-size="11">one permit back every 12 s</text>
<line x1="170" y1="160" x2="770" y2="160" stroke="#c3c2b7" stroke-width="1"/>
<circle cx="338.0" cy="160" r="5" fill="#0ca30c"/>
<circle cx="352.40000000000003" cy="160" r="5" fill="#0ca30c"/>
<circle cx="366.80000000000007" cy="160" r="5" fill="#0ca30c"/>
<circle cx="381.19999999999993" cy="160" r="5" fill="#0ca30c"/>
<circle cx="395.59999999999997" cy="160" r="5" fill="#0ca30c"/>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="415.09999999999997" y1="155.5" x2="424.09999999999997" y2="164.5"/><line x1="424.09999999999997" y1="155.5" x2="415.09999999999997" y2="164.5"/></g>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="429.5" y1="155.5" x2="438.5" y2="164.5"/><line x1="438.5" y1="155.5" x2="429.5" y2="164.5"/></g>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="443.90000000000003" y1="155.5" x2="452.90000000000003" y2="164.5"/><line x1="452.90000000000003" y1="155.5" x2="443.90000000000003" y2="164.5"/></g>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="458.30000000000007" y1="155.5" x2="467.30000000000007" y2="164.5"/><line x1="467.30000000000007" y1="155.5" x2="458.30000000000007" y2="164.5"/></g>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="472.69999999999993" y1="155.5" x2="481.69999999999993" y2="164.5"/><line x1="481.69999999999993" y1="155.5" x2="472.69999999999993" y2="164.5"/></g>
<text x="770" y="186" text-anchor="end" fill="#0ca30c" font-size="11" font-family="monospace">5 of 10 admitted within 6 s</text>
<line x1="410.0" y1="46" x2="410.0" y2="196" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="410.0" y="40" text-anchor="middle" fill="#d03b3b" font-size="11">minute boundary</text>
<line x1="170.0" y1="206" x2="170.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="170.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">50 s</text>
<line x1="290.0" y1="206" x2="290.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="290.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">55 s</text>
<line x1="410.0" y1="206" x2="410.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="410.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">60 s</text>
<line x1="530.0" y1="206" x2="530.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="530.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">65 s</text>
<line x1="650.0" y1="206" x2="650.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="650.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">70 s</text>
<line x1="770.0" y1="206" x2="770.0" y2="210" stroke="#c3c2b7" stroke-width="1"/>
<text x="770.0" y="224" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">75 s</text>
<text x="10" y="22" text-anchor="start" fill="#222" font-size="13">A limit of 5 per minute. A client sends five requests just before a minute boundary and five just after.</text>
<circle cx="170" cy="242" r="5" fill="#0ca30c"/>
<text x="180" y="246" text-anchor="start" fill="#666" font-size="11">admitted</text>
<g stroke="#d03b3b" stroke-width="2.2" stroke-linecap="round"><line x1="255.5" y1="237.5" x2="264.5" y2="246.5"/><line x1="264.5" y1="237.5" x2="255.5" y2="246.5"/></g>
<text x="270" y="246" text-anchor="start" fill="#666" font-size="11">refused with 429</text>
</svg>

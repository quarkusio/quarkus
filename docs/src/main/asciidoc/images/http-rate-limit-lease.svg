<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 250" width="790" height="250" font-family="sans-serif" font-size="12">
<title>In lease mode an instance claims several permits from Redis at once and hands them out locally</title>
<rect width="790" height="250" fill="#ffffff"/>
<rect x="300" y="30" width="190" height="52" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="395.0" y="53.0" text-anchor="middle" fill="#222" font-weight="600">Redis</text>
<text x="395.0" y="69.0" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">the shared count</text>
<rect x="30" y="130" width="220" height="54" rx="4" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="140.0" y="154.0" text-anchor="middle" fill="#222" font-weight="600">instance 1</text>
<text x="140.0" y="170.0" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">served 3, 1 left until it expires</text>
<line x1="395" y1="82" x2="146.9" y2="126.8" stroke="#666" stroke-width="1.5"/>
<polygon points="140.0,128.0 147.5,123.1 148.8,130.0" fill="#666"/>
<text x="200" y="108" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">claims 4</text>
<circle cx="70" cy="210" r="5" fill="#0ca30c"/>
<circle cx="100" cy="210" r="5" fill="#0ca30c"/>
<circle cx="130" cy="210" r="5" fill="#0ca30c"/>
<text x="140" y="236" text-anchor="middle" fill="#666" font-size="11">requests served without a call to Redis</text>
<rect x="285" y="130" width="220" height="54" rx="4" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="395.0" y="154.0" text-anchor="middle" fill="#222" font-weight="600">instance 2</text>
<text x="395.0" y="170.0" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">served 2, claims again when needed</text>
<line x1="395" y1="82" x2="395.0" y2="121.0" stroke="#666" stroke-width="1.5"/>
<polygon points="395.0,128.0 391.5,119.7 398.5,119.7" fill="#666"/>
<text x="435" y="108" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">claims 2</text>
<circle cx="325" cy="210" r="5" fill="#0ca30c"/>
<circle cx="355" cy="210" r="5" fill="#0ca30c"/>
<text x="395" y="236" text-anchor="middle" fill="#666" font-size="11">requests served without a call to Redis</text>
<rect x="540" y="130" width="220" height="54" rx="4" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="650.0" y="154.0" text-anchor="middle" fill="#222" font-weight="600">instance 3</text>
<text x="650.0" y="170.0" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">holds nothing</text>
<text x="10" y="22" text-anchor="start" fill="#222" font-size="13">One claim takes up to lease-size permits; they expire lease-size intervals after the claim.</text>
</svg>

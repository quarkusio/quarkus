# OIDC configuration
quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus
quarkus.oidc.client-id=quarkus-service-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=service

# GraphQL typesafe client configuration
# Points back to this app's own GraphQL endpoint (QuarkusUnitTest uses port 8081 by default)
quarkus.smallrye-graphql-client.propagation-client.url=http://localhost:8081/graphql

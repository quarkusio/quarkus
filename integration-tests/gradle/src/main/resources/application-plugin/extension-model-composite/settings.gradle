pluginManagement {
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus.extension' version "${quarkusPluginVersion}"
        id 'io.quarkus.extension.deployment' version "${quarkusPluginVersion}"
        id 'com.github.vlsi.jandex' version '1.86'
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
                includeGroup 'org.hibernate.orm'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'extension-model-composite'
include 'runtime', 'deployment', 'helper'
project(':runtime').name = 'main-extension'
project(':deployment').name = 'main-extension-deployment'
includeBuild 'support-extension'

name: Surge.sh Preview

on:
  workflow_run:
    workflows: ["Quarkus Documentation CI"]
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      # this is unfortunately needed to be able to write comments on pull requests
      pull-requests: write
      packages: read
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quarkusio/quarkusio.github.io
          fetch-depth: 5000
          fetch-tags: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quarkusio/quarkus
          path: quarkus-main

      - name: Download PR Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: documentation
          path: documentation-temp
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Store PR id as variable
        id: pr
        run: |
          pr=$(<documentation-temp/pr-id.txt)
          if ! [[ $pr =~ ^[0-9]+$ ]] ; then
            echo "PR id extracted from documentation-temp/pr-id.txt is not a number: $pr"
            exit 1
          fi
          echo "id=$(<documentation-temp/pr-id.txt)" >> $GITHUB_OUTPUT
      - name: Sync documentation
        shell: bash
        # make sure we override the script coming from the artifact with the version from the main repository
        run: |
          rm ./documentation-temp/docs/sync-web-site.sh
          cp -a ./quarkus-main/docs/sync-web-site.sh ./documentation-temp/docs/
          chmod 755 ./documentation-temp/docs/sync-web-site.sh
          ./documentation-temp/docs/sync-web-site.sh main ../../
          rm -rf documentation-temp
          rm -rf quarkus-main

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build with Maven
        run: QUARKUS_ROQ_GENERATOR_BATCH=true QUARKUS_PROFILE=only-latest-guides mvn -B package quarkus:run -DskipTests

      - name: Reduce the size of the website to be compatible with surge
        run: |
          rm -rf target/roq/assets/images/posts/
          rm -rf target/roq/assets/images/books/
          rm -rf target/roq/assets/images/events/
          rm -rf target/roq/assets/images/quarkus2/
          rm -rf target/roq/assets/images/quarkus3/
          rm -rf target/roq/assets/images/worldtour/
          rm -rf target/roq/assets/stickers
          rm -rf target/roq/assets/images/desktopwallpapers
          rm -rf target/roq/assets/images/stickers
          rm -rf target/roq/newsletter
          # we only need the images from the main version
          rm -rf target/roq/guides/images/
          rm -rf target/roq/blog/
      - name: Publishing to surge for preview
        id: deploy
        run: npx surge@0.23.1 ./target/roq --domain https://quarkus-pr-main-${PR_ID}-preview.surge.sh --token ${{ secrets.SURGE_TOKEN }}
        env:
          PR_ID: ${{ steps.pr.outputs.id }}

      - name: Update PR status comment on success
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            🎊 PR Preview ${{ github.sha }} has been successfully built and deployed to https://quarkus-pr-main-${{ steps.pr.outputs.id }}-preview.surge.sh/version/main/guides/

            - Images of blog posts older than 3 months are not available.
            - Newsletters older than 3 months are not available.

            <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">
          body-marker: <!-- Preview status comment marker -->
      - name: Update PR status comment on failure
        uses: quarkusio/action-helpers@main
        if: ${{ failure() }}
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
          body-marker: <!-- Preview status comment marker -->

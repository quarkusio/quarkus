<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{contextRoot}lumo.css">

        <script type="module" src="{contextRoot}bundle/produi-app.js"></script>

        <title>Prod UI</title>
        <script type="module">
            import { applicationName, applicationVersion } from '{contextRoot}produi-app-info.js';
            if (applicationName) document.title = 'Prod UI | ' + applicationName + ' ' + applicationVersion;
        </script>

        <style>
            body {
                --lumo-clickable-cursor: pointer;
                --pui-header-height: 50px;
                --lumo-base-color: hsla(220, 14%, 97%, 1);
                --lumo-contrast: hsla(220, 13%, 10%, 1);
                --lumo-primary-color: hsla(213, 94%, 58%, 1);
                --lumo-primary-text-color: hsla(213, 94%, 58%, 1);
                --lumo-primary-contrast-color: hsla(0, 0%, 100%, 1);
                --lumo-primary-color-10pct: hsla(213, 94%, 58%, 0.1);
                --lumo-error-color: hsla(4, 90%, 58%, 1);
                --lumo-error-text-color: hsla(3, 90%, 42%, 1);
                --lumo-header-text-color: hsla(0, 0%, 13%, 1);
                --lumo-body-text-color: hsla(0, 0%, 20%, 0.94);
                --lumo-secondary-text-color: hsla(0, 0%, 40%, 0.69);
                --lumo-tertiary-text-color: hsla(0, 0%, 50%, 0.52);
                --lumo-disabled-text-color: hsla(0, 0%, 60%, 0.26);
                --lumo-warning-color: hsla(30, 100%, 50%, 1);
                --lumo-success-color: hsla(145, 72%, 30%, 1);
                --lumo-contrast-5pct: hsla(0, 0%, 13%, 0.05);
                --lumo-contrast-10pct: hsla(0, 0%, 13%, 0.10);
                --lumo-contrast-20pct: hsla(0, 0%, 13%, 0.20);
                --lumo-contrast-30pct: hsla(0, 0%, 13%, 0.30);
                --lumo-contrast-50pct: hsla(0, 0%, 13%, 0.50);
                --quarkus-blue: hsla(213, 94%, 58%, 1);
                --quarkus-red: hsla(4, 90%, 58%, 1);
                --quarkus-center: hsla(220, 13%, 10%, 1);
                margin: 0;
                width: 100vw;
                height: 100vh;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                font-size: var(--lumo-font-size-m);
                line-height: var(--lumo-line-height-m);
                overflow: hidden;
                color: var(--lumo-body-text-color);
                background: var(--lumo-base-color);
                -webkit-font-smoothing: antialiased;
            }
        </style>
    </head>
    <body>
        <pui-app></pui-app>
    </body>
</html>

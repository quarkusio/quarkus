# Setting these for tests explicitly. Not required in normal application
quarkus.application.name=opentelemetry-integration-test
quarkus.application.version=999-SNAPSHOT

# The worst case for the resource entities the SDK builds: a service.name that differs from the
# application name, plus a service.instance.id the SDK would otherwise generate itself.
quarkus.otel.resource.attributes=service.name=opentelemetry-integration-service,service.instance.id=42

# ResourceWarningTest reads the startup log to check the SDK built the resource without complaining.
# The format spells the logger category out in full, which the default %c{3.} abbreviates.
quarkus.log.file.enabled=true
quarkus.log.file.format=%d{HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n

# speed up build
quarkus.otel.bsp.schedule.delay=100
quarkus.otel.bsp.export.timeout=5s
quarkus.otel.metric.export.interval=100ms

pingpong/mp-rest/url=${test.url}
simple/mp-rest/url=${test.url}

quarkus.security.users.embedded.roles.stuart=READER,WRITER
quarkus.security.users.embedded.roles.scott=READER
quarkus.security.users.embedded.users.stuart=writer
quarkus.security.users.embedded.users.scott=reader
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.enabled=true
quarkus.http.auth.basic=true

quarkus.otel.traces.suppress-application-uris=/suppress-app-uri
# Sampler should be at 100% for testing purposes
quarkus.otel.traces.sampler.arg=1.0d

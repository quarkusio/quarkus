quarkus.keycloak.devservices.enabled=false

quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus
quarkus.oidc.client-id=quarkus-web-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app

# `tenant-a` and `tenant-a_1` tenant ids overlap with an underscore, it is allowed because `tenant-a` is a service tenant
quarkus.oidc.tenant-a.auth-server-url=${keycloak.url}/realms/quarkus
quarkus.oidc.tenant-a.client-id=quarkus-service-app
quarkus.oidc.tenant-a.credentials.secret=secret
quarkus.oidc.tenant-a.application-type=service

quarkus.oidc.tenant-a_1.auth-server-url=${keycloak.url}/realms/quarkus
quarkus.oidc.tenant-a_1.client-id=quarkus-web-app
quarkus.oidc.tenant-a_1.credentials.secret=secret
quarkus.oidc.tenant-a_1.application-type=web-app

quarkus.log.category."org.htmlunit".level=ERROR

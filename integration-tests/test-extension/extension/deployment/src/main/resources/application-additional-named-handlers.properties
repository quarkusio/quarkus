quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.level=WARNING
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s%e%n
# Link the named handler contributed by the extension to a category and to the root logger
quarkus.log.category."io.quarkus.namedcategory".level=INFO
quarkus.log.category."io.quarkus.namedcategory".handlers=TEST_NAMED
quarkus.log.category."io.quarkus.namedcategory".use-parent-handlers=false
quarkus.log.handlers=TEST_NAMED
# Resource path to DSAPublicKey base64 encoded bytes
quarkus.root.dsa-key-location=/DSAPublicKey.encoded

quarkus.application.name=http-rate-limit-redis

# one Dev Services Redis for the default client, another for the 'limits' client of RedisNamedClientTest
quarkus.redis.limits.devservices.enabled=true

quarkus.http.rate-limit.rules.api.paths=/api/*
quarkus.http.rate-limit.rules.api.phase=pre-authentication
quarkus.http.rate-limit.rules.api.request-key=header:X-Client
quarkus.http.rate-limit.rules.api.permits=3
quarkus.http.rate-limit.rules.api.window=1m
quarkus.http.rate-limit.rules.api.store=redis

# lease mode: T = 10s, so the lease time (lease-size x T = 20s) outlives every test and no chunk expires
quarkus.http.rate-limit.rules.lease.paths=/lease/*
quarkus.http.rate-limit.rules.lease.phase=pre-authentication
quarkus.http.rate-limit.rules.lease.request-key=header:X-Client
quarkus.http.rate-limit.rules.lease.permits=6
quarkus.http.rate-limit.rules.lease.window=1m
quarkus.http.rate-limit.rules.lease.store=redis
quarkus.http.rate-limit.rules.lease.lease-size=2

quarkus.http.rate-limit.store-timeout=500ms
# a store failure answers 503 instead of falling back to local limiting, so the tests see every Redis failure
quarkus.http.rate-limit.store-failure-mode=closed

# Named subscriptions use a resolver without an inline default limit, with both direct Redis calls and leases.
quarkus.http.rate-limit.limits.free.permits=2
quarkus.http.rate-limit.limits.free.window=1h
quarkus.http.rate-limit.limits.paid.permits=4
quarkus.http.rate-limit.limits.paid.window=1h
quarkus.http.rate-limit.rules.subscription.paths=/subscription/*
quarkus.http.rate-limit.rules.subscription.phase=pre-authentication
quarkus.http.rate-limit.rules.subscription.request-key=header:X-Client
quarkus.http.rate-limit.rules.subscription.limit-resolver=subscription
quarkus.http.rate-limit.rules.subscription.store=redis
quarkus.http.rate-limit.rules.subscription-lease.paths=/subscription-lease/*
quarkus.http.rate-limit.rules.subscription-lease.phase=pre-authentication
quarkus.http.rate-limit.rules.subscription-lease.request-key=header:X-Client
quarkus.http.rate-limit.rules.subscription-lease.limit-resolver=subscription
quarkus.http.rate-limit.rules.subscription-lease.store=redis
quarkus.http.rate-limit.rules.subscription-lease.lease-size=2

# Failure paths are also exercised against the native executable.
quarkus.http.rate-limit.rules.unavailable-key.paths=/unavailable-key/*
quarkus.http.rate-limit.rules.unavailable-key.phase=pre-authentication
quarkus.http.rate-limit.rules.unavailable-key.request-key=custom:unavailable
quarkus.http.rate-limit.rules.unavailable-key.limit=free
quarkus.http.rate-limit.rules.unavailable-store.paths=/unavailable-store/*
quarkus.http.rate-limit.rules.unavailable-store.phase=pre-authentication
quarkus.http.rate-limit.rules.unavailable-store.request-key=header:X-Client
quarkus.http.rate-limit.rules.unavailable-store.limit=free
quarkus.http.rate-limit.rules.unavailable-store.store=unavailable
quarkus.http.rate-limit.rules.unavailable-lease.paths=/unavailable-lease/*
quarkus.http.rate-limit.rules.unavailable-lease.phase=pre-authentication
quarkus.http.rate-limit.rules.unavailable-lease.request-key=header:X-Client
quarkus.http.rate-limit.rules.unavailable-lease.limit=free
quarkus.http.rate-limit.rules.unavailable-lease.store=unavailable
quarkus.http.rate-limit.rules.unavailable-lease.lease-size=1

quarkus.log.level=INFO
quarkus.log.console.enabled=false

# Global JSON enabled for file handlers
quarkus.log.file.json.enabled=true

# Named handler without format and json config - should inherit global JSON
quarkus.log.handler.file.inherit-file.enabled=true
quarkus.log.handler.file.inherit-file.path=target/test-named-file-inherit.log
quarkus.log.category."named.file.inherit".handlers=inherit-file
quarkus.log.category."named.file.inherit".use-parent-handlers=false

# Named handler with a custom format - should use the format instead of the global JSON
quarkus.log.handler.file.custom-format-file.enabled=true
quarkus.log.handler.file.custom-format-file.path=target/test-named-file-custom-format.log
quarkus.log.handler.file.custom-format-file.format=%d{yyyy-MM-dd HH:mm:ss} [%p] %s%e%n
quarkus.log.category."named.file.custom".handlers=custom-format-file
quarkus.log.category."named.file.custom".use-parent-handlers=false

# Named handler with a custom format and json.enabled=true - JSON wins
quarkus.log.handler.file.custom-format-json-file.enabled=true
quarkus.log.handler.file.custom-format-json-file.path=target/test-named-file-custom-format-json.log
quarkus.log.handler.file.custom-format-json-file.format=%d{yyyy-MM-dd HH:mm:ss} [%p] %s%e%n
quarkus.log.handler.file.custom-format-json-file.json.enabled=true
quarkus.log.category."named.file.custom.json".handlers=custom-format-json-file
quarkus.log.category."named.file.custom.json".use-parent-handlers=false

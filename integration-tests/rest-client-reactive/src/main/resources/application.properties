w-client-logger/mp-rest/url=quarkus://vertx-http
w-exception-mapper/mp-rest/url=quarkus://vertx-http
w-exception-mapper-and-interceptor/mp-rest/url=quarkus://vertx-http
w-fault-tolerance/mp-rest/url=quarkus://vertx-http
correlation/mp-rest/url=quarkus://vertx-http
io.quarkus.it.rest.client.main.ParamClient/mp-rest/url=quarkus://vertx-http
# global client logging scope
quarkus.rest-client.logging.scope=request-response

quarkus.rest-client."remote-resource".follow-redirects=true
quarkus.rest-client."remote-resource".url=quarkus://vertx-http

# speed up build
quarkus.otel.bsp.schedule.delay=10

# Sampler should be at 100% for testing purposes
quarkus.otel.traces.sampler.arg=1.0d

quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

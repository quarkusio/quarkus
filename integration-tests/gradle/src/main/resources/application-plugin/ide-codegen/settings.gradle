pluginManagement {
    repositories {
        mavenLocal {
            content {
                includeGroupByRegex 'io.quarkus.*'
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'io.quarkus.application' version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'application-plugin-ide-codegen'

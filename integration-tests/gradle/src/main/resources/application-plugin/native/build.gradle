plugins {
    id 'io.quarkus.application'
}

repositories {
    mavenLocal {
        content {
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

group = 'org.acme'
version = '1.0.0-SNAPSHOT'

quarkusApplication {
    buildForkOptions {
        systemProperty 'gradle.quarkus.native-worker-diagnostics', 'true'
    }
    builds {
        nativeExecutable('parity') {
            archiveBaseName.set('application-native')
            archiveBaseNameSuffix.set('-custom')
            archiveVersion.set('2.0')
            archiveRunnerSuffix.set('-binary')
            archiveAddRunnerSuffix.set(true)
        }
    }
}

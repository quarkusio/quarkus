import io.quarkus.gradle.application.dsl.QuarkusApplicationJvmTestSuite
import io.quarkus.gradle.application.model.QuarkusApplicationImageBuilder
import io.quarkus.gradle.application.model.QuarkusApplicationJvmStartupArchiveType
import io.quarkus.gradle.application.model.QuarkusApplicationStartupArchiveTrainingExecutionTarget
import org.gradle.api.plugins.jvm.JvmTestSuite

plugins {
    id 'io.quarkus.application'
}

repositories {
    mavenLocal {
        content {
            includeGroupByRegex 'io.quarkus.*'
            includeGroup 'org.hibernate.orm'
        }
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-container-image-jib'
    implementation 'io.quarkus:quarkus-rest'
}

group = 'org.acme'
version = '1.0.0-SNAPSHOT'

def archiveType = QuarkusApplicationJvmStartupArchiveType.valueOf(
        providers.gradleProperty('startupArchiveType').get())
def baseImageReference = providers.gradleProperty('startupArchiveBaseImageReference')
def runtimeBaseImage = providers.gradleProperty('startupArchiveRuntimeBaseImage')

quarkusApplication {
    builds {
        aotJar('optimized', archiveType) {
            image {
                imageReference.set(baseImageReference)
                builder.set(QuarkusApplicationImageBuilder.JIB)
                quarkusBuildProperties.put('quarkus.jib.base-jvm-image', runtimeBaseImage)
            }
            startupOptimizedImage {
            }
        }
    }
}

testing {
    suites {
        startupArchiveTraining(JvmTestSuite) {
            dependencies {
                implementation enforcedPlatform(
                        "${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
                implementation project()
                implementation 'io.quarkus:quarkus-junit'
                implementation 'io.rest-assured:rest-assured'
                runtimeOnly 'org.junit.platform:junit-platform-launcher'
            }
            extensions.configure(QuarkusApplicationJvmTestSuite) { quarkusSuite ->
                quarkusSuite.forQuarkusIntegrationTests('optimized')
                quarkusSuite.startupArchiveTraining {
                    executionTarget.set(QuarkusApplicationStartupArchiveTrainingExecutionTarget.BASE_IMAGE)
                }
            }
        }
    }
}

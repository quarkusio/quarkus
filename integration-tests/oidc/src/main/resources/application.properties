quarkus.keycloak.devservices.create-realm=false
quarkus.keycloak.devservices.start-command=start --https-client-auth=required --hostname-strict=false --https-key-store-file=/etc/server-keystore.p12 --https-trust-store-file=/etc/server-truststore.p12 --https-trust-store-password=password --truststore-paths=/etc/quarkus-server.crt --tls-hostname-verifier=ANY --spi-user-profile-declarative-user-profile-config-file=/opt/keycloak/upconfig.json
quarkus.keycloak.devservices.resource-aliases.keystore=target/certificates/oidc-keystore.p12
quarkus.keycloak.devservices.resource-aliases.truststore=target/certificates/oidc-server-truststore.p12
quarkus.keycloak.devservices.resource-mappings.keystore=/etc/server-keystore.p12
quarkus.keycloak.devservices.resource-mappings.truststore=/etc/server-truststore.p12

quarkus.oidc.token.principal-claim=email
quarkus.oidc.resource-metadata.enabled=true

quarkus.oidc.tls.tls-configuration-name=oidc-tls

quarkus.oidc.jwk-delayed-resolution.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.jwk-delayed-resolution.jwks.resolve-early=false
quarkus.oidc.jwk-delayed-resolution.tls.tls-configuration-name=oidc-tls

quarkus.tls.oidc-tls.key-store.jks.path=target/certificates/oidc-client-keystore.p12
quarkus.tls.oidc-tls.key-store.jks.password=password
quarkus.tls.oidc-tls.trust-store.jks.path=target/certificates/oidc-client-truststore.p12
quarkus.tls.oidc-tls.trust-store.jks.password=password
quarkus.tls.oidc-tls.hostname-verification-algorithm=NONE

# CIMD tenant using HTTPS URL as client-id
quarkus.oidc.tenant-cimd.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.tenant-cimd.client-id=https://host.testcontainers.internal:8444/client-id-metadata/tenant-cimd
quarkus.oidc.tenant-cimd.client-name=Tenant CIMD
quarkus.oidc.tenant-cimd.authentication.redirect-path=/tenant-cimd
quarkus.oidc.tenant-cimd.tls.tls-configuration-name=oidc-tls
quarkus.oidc.tenant-cimd.application-type=web-app

# CIMD tenant with private_key_jwt authentication
quarkus.oidc.tenant-cimd-jwt.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.tenant-cimd-jwt.client-id=https://host.testcontainers.internal:8444/client-id-metadata/tenant-cimd-jwt
quarkus.oidc.tenant-cimd-jwt.client-name=Tenant CIMD JWT
quarkus.oidc.tenant-cimd-jwt.credentials.jwt.key-file=target/certificates/cimd-jwt.key
quarkus.oidc.tenant-cimd-jwt.credentials.jwt.public-key-file=target/certificates/cimd-jwt.crt
quarkus.oidc.tenant-cimd-jwt.authentication.redirect-path=/tenant-cimd-jwt
quarkus.oidc.tenant-cimd-jwt.tls.tls-configuration-name=oidc-tls
quarkus.oidc.tenant-cimd-jwt.application-type=web-app

# HTTPS for CIMD metadata endpoints
quarkus.tls.oidc-server-tls.key-store.p12.path=target/certificates/oidc-keystore.p12
quarkus.tls.oidc-server-tls.key-store.p12.password=password
quarkus.http.tls-configuration-name=oidc-server-tls

quarkus.keycloak.devservices.show-logs=true
quarkus.keycloak.devservices.features=cimd
quarkus.keycloak.devservices.host-accessible-ports=8444
quarkus.keycloak.devservices.resource-aliases.quarkus-server-cert=target/certificates/oidc.crt
quarkus.keycloak.devservices.resource-mappings.quarkus-server-cert=/etc/quarkus-server.crt

quarkus.native.additional-build-args=-H:IncludeResources=.*\\.p12

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=password
quarkus.security.users.embedded.roles.alice=user

quarkus.http.auth.permission.basic.paths=/basic-only
quarkus.http.auth.permission.basic.policy=authenticated
quarkus.http.auth.permission.basic.auth-mechanism=basic

quarkus.http.auth.permission.bearer.paths=/bearer-only
quarkus.http.auth.permission.bearer.policy=authenticated
quarkus.http.auth.permission.bearer.auth-mechanism=bearer

quarkus.http.auth.permission.cimd.paths=/tenant-cimd,/tenant-cimd-jwt,/tenant-cimd-dynamic
quarkus.http.auth.permission.cimd.policy=authenticated
quarkus.http.auth.permission.cimd.auth-mechanism=code


quarkus.log.category."io.quarkus.oidc.runtime".min-level=TRACE
quarkus.log.category."io.quarkus.oidc.runtime".level=TRACE
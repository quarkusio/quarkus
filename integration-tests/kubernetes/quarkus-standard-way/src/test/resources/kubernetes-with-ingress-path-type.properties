quarkus.kubernetes.ingress.expose=true
quarkus.kubernetes.ingress.host=prod.svc.url
quarkus.kubernetes.ports.http.path=/something(/|$)(.*)
quarkus.kubernetes.ingress.path-type=ImplementationSpecific


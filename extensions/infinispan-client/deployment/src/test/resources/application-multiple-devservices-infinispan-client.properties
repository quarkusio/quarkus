quarkus.infinispan-client.devservices.enabled=false

# Configure clients to use BASIC intelligence mode to avoid connection timeout
# issues on non-Linux platforms where Docker container IPs are not routable
quarkus.infinispan-client.site-lon.devservices.enabled=true
quarkus.infinispan-client.site-lon.devservices.port=11222
quarkus.infinispan-client.site-lon.client-intelligence=BASIC

quarkus.infinispan-client.site-nyc.devservices.enabled=true
quarkus.infinispan-client.site-nyc.devservices.port=31222
quarkus.infinispan-client.site-nyc.client-intelligence=BASIC

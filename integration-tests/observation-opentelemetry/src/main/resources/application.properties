quarkus.application.name=observation-opentelemetry-integration-test

# Speed up tests
quarkus.otel.bsp.schedule.delay=100
quarkus.otel.bsp.export.timeout=5s
quarkus.otel.traces.sampler.arg=1.0d
# The endpoints of ExporterResource are test plumbing, their spans must not show up among the spans under test
quarkus.otel.traces.suppress-application-uris=/reset,/export/*
quarkus.otel.metrics.exporter=none

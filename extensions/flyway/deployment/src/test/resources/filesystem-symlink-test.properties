# Test symbolic links
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost/mem:test_symlink;DB_CLOSE_DELAY=-1

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=filesystem:/tmp/flyway-symlink-test/symlink-to-migrations
quarkus.log.category."io.quarkus.flyway.runtime".level=DEBUG
